<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Persian Darbar</title>
    <meta name="description" content="Login to your Persian Darbar account to order food and manage reservations.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #0c0c0f;
            overflow: hidden;
        }

        /* ---- LEFT: IMAGE PANEL ---- */
        .auth-image {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 60px;
            overflow: hidden;
        }

        .auth-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to top, rgba(12, 12, 15, 0.95) 0%, rgba(12, 12, 15, 0.3) 50%, transparent 100%),
                url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=85');
            background-size: cover;
            background-position: center;
            animation: slowZoom 20s ease-in-out infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .auth-image-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .auth-image-content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .auth-image-content h2 span { color: #ff9850; }

        .auth-image-content p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 17px;
            max-width: 400px;
            line-height: 1.7;
        }

        /* ---- RIGHT: FORM PANEL ---- */
        .auth-form-panel {
            width: 520px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: #111116;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        /* Ambient glow */
        .auth-form-panel::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(211, 84, 0, 0.08), transparent 70%);
            top: -80px;
            right: -80px;
            border-radius: 50%;
            pointer-events: none;
        }

        .auth-logo {
            margin-bottom: 48px;
        }

        .auth-logo a {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }

        .auth-logo a span { color: #d35400; }

        .auth-title {
            margin-bottom: 8px;
        }

        .auth-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 700;
            color: #fff;
        }

        .auth-title h1 span { color: #d35400; }

        .auth-subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .auth-subtitle a {
            color: #d35400;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-subtitle a:hover { text-decoration: underline; }

        /* ---- FORM ---- */
        .auth-form { display: flex; flex-direction: column; gap: 20px; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #e1e4ea;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #d35400;
            background: rgba(211, 84, 0, 0.04);
            box-shadow: 0 0 0 4px rgba(211, 84, 0, 0.08);
        }

        .input-group input::placeholder { color: #444; }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d35400, #e67e22);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(211, 84, 0, 0.35);
        }

        .submit-btn:hover::after { opacity: 1; }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---- DIVIDER ---- */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #444;
            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ---- BACK LINK ---- */
        .back-home {
            text-align: center;
            margin-top: 32px;
        }

        .back-home a {
            color: #555;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home a:hover { color: #d35400; }

        /* ---- ERROR / SUCCESS ---- */
        .auth-message {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            animation: msgIn 0.4s ease;
            display: none;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-message.error {
            display: block;
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .auth-message.success {
            display: block;
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        /* ---- PASSWORD TOGGLE ---- */
        .password-wrap {
            position: relative;
        }

        .password-wrap input { padding-right: 50px; }

        .toggle-pass {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pass:hover { color: #d35400; }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 1000px) {
            .auth-image { display: none; }
            .auth-form-panel {
                width: 100%;
                padding: 40px 28px;
            }
        }
    </style>
</head>

<body>

    <!-- LEFT: IMAGE PANEL -->
    <div class="auth-image">
        <div class="auth-image-content">
            <h2>Welcome Back to<br><span>Persian Darbar.</span></h2>
            <p>Login to your account to order your favourite dishes, track orders, and enjoy exclusive offers.</p>
        </div>
    </div>

    <!-- RIGHT: FORM PANEL -->
    <div class="auth-form-panel">

        <div class="auth-logo">
            <a href="/">Persian Darbar<span>.</span></a>
        </div>

        <div class="auth-title">
            <h1>Sign <span>In</span></h1>
        </div>
        <p class="auth-subtitle">
            Don't have an account? <a href="/signup.html">Create one</a>
        </p>

        <div class="auth-message" id="authMessage"></div>

        <form class="auth-form" id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="password-wrap">
                    <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password" minlength="6">
                    <button type="button" class="toggle-pass" onclick="togglePassword(this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Sign In →
            </button>

        </form>

        <div class="back-home">
            <a href="/">← Back to Website</a>
            <span style="color: #444; margin: 0 10px;">•</span>
            <a href="/admin" style="color: #d35400; font-weight: 600;">Admin Dashboard →</a>
        </div>

    </div>

    <script>
        // Toggle password visibility
        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('authMessage');
            msg.textContent = text;
            msg.className = 'auth-message ' + type;
        }

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const email = e.target.querySelector('[name="email"]').value;
            const password = e.target.querySelector('[name="password"]').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    showMessage('✅ ' + data.message + ' Redirecting...', 'success');
                    setTimeout(() => {
                        if (data.isAdmin) {
                            window.location.href = '/admin/dashboard';
                        } else {
                            window.location.href = '/';
                        }
                    }, 1000);
                } else {
                    showMessage('⚠️ ' + data.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Sign In →';
                }
            } catch (err) {
                showMessage('❌ Something went wrong. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In →';
            }
        });
    </script>

</body>

</html>
